<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper summaries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Topics and papers">
    <div class="rail-head">
      <p class="eyebrow">Thesis reading set</p>
      <h1>Paper summaries</h1>
    </div>
    <div id="nav"></div>
  </nav>
  <button id="fold" class="fold" type="button" aria-controls="rail" aria-expanded="true"
          title="Hide the navigation (\)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
    <line x1="9.5" y1="4" x2="9.5" y2="20"></line>
  </svg><span class="sr">Toggle navigation</span></button>
  <main class="main">
    <div id="view" class="view" aria-live="polite">
      <p class="msg">Loading&hellip;</p>
    </div>
  </main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
</body>
</html>
